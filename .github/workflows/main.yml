name: CI Train and Upload

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quick training
        run: |
          python agent/train_agent.py --config train/config.yaml --epochs 1 --batch-size 64 --output-dir outputs

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint
          path: outputs/model.pt

      - name: Optionally upload to Moithub
        if: secrets.MOITHUB_TOKEN != '' && secrets.MOITHUB_API_URL != ''
        env:
          MOITHUB_TOKEN: ${{ secrets.MOITHUB_TOKEN }}
          MOITHUB_API_URL: ${{ secrets.MOITHUB_API_URL }}
        run: |
          python -c "from agent.utils import maybe_upload; maybe_upload('outputs/model.pt', {'moithub_api_url': None, 'moithub_token': None})"
